# ===================================
# nginx.conf для platinovskaya.fit
# Загрузить в корень сайта (рядом с .htaccess)
# ===================================

# --- Редирект HTTP → HTTPS ---
server {
    listen 80;
    server_name platinovskaya.fit www.platinovskaya.fit;
    return 301 https://platinovskaya.fit$request_uri;
}

# --- Редирект www → без www ---
server {
    listen 443 ssl;
    server_name www.platinovskaya.fit;
    return 301 https://platinovskaya.fit$request_uri;
}

# --- Основной сервер ---
server {
    listen 443 ssl;
    server_name platinovskaya.fit;

    root /var/www/platinovskaya.fit/public_html;
    index index.html;

    charset utf-8;

    # ===================================
    # Кэширование статики
    # ===================================
    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(ttf|otf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===================================
    # Безопасность
    # ===================================
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Запрет доступа к служебным файлам
    location ~* (\.htaccess|\.git|composer\.json|package\.json|gulpfile\.js)$ {
        deny all;
        return 404;
    }

    # ===================================
    # Редирект index.html → /
    # ===================================
    location = /index.html {
        return 301 /;
    }

    # ===================================
    # Редиректы со старых .html URL
    # ===================================
    location = /light-start.html                { return 301 /courses/legkiy-start-dlya-nachinayushchikh/; }
    location = /online-consultation.html        { return 301 /uslugi/onlayn-konsultatsiya/; }
    location = /personal-trainings.html         { return 301 /uslugi/personalnye-trenirovki/; }
    location = /yagoditsy-press.html            { return 301 /courses/yagoditsy-i-press/; }
    location = /smoothie-detox.html             { return 301 /courses/smuzi-detoks/; }
    location = /check-up.html                   { return 301 /uslugi/check-up/; }
    location = /ideal-body.html                 { return 301 /courses/idealnoye-telo/; }
    location = /antioffice.html                 { return 301 /courses/anti-ofis/; }
    location = /nutrition-accompaniment.html    { return 301 /uslugi/soprovozhdenie-po-pitaniyu/; }
    location = /webinars.html                   { return 301 /courses/vebinary/; }
    location = /about.html                      { return 301 /about/; }
    location = /contacts.html                   { return 301 /contacts/; }
    location = /cases.html                      { return 301 /cases/; }
    location = /blog.html                       { return 301 /blog/; }
    location = /useful.html                     { return 301 /useful/; }
    location = /certificates.html               { return 301 /certificates/; }
    location = /privacy-policy.html             { return 301 /privacy-policy/; }
    location = /personal-data-policy.html       { return 301 /personal-data-policy/; }
    location = /terms-of-service.html           { return 301 /terms-of-service/; }
    location = /consent-personal-data.html      { return 301 /consent-personal-data/; }
    location = /payment.html                    { return 301 /payment/; }

    # ===================================
    # Редиректы со старых /courses/ URL на /uslugi/
    # ===================================
    location ~* ^/courses/onlayn-konsultatsiya-fitnes/?$    { return 301 /uslugi/onlayn-konsultatsiya/; }
    location ~* ^/courses/personalnye-trenirovki/?$         { return 301 /uslugi/personalnye-trenirovki/; }
    location ~* ^/courses/check-up-organizma/?$             { return 301 /uslugi/check-up/; }
    location ~* ^/courses/soprovozhdenie-po-pitaniyu/?$     { return 301 /uslugi/soprovozhdenie-po-pitaniyu/; }

    # ===================================
    # Маршруты курсов → .html файлы
    # ===================================
    location ~* ^/courses/legkiy-start-dlya-nachinayushchikh/?$ { rewrite ^ /light-start.html last; }
    location ~* ^/courses/yagoditsy-i-press/?$                  { rewrite ^ /yagoditsy-press.html last; }
    location ~* ^/courses/smuzi-detoks/?$                       { rewrite ^ /smoothie-detox.html last; }
    location ~* ^/courses/idealnoye-telo/?$                     { rewrite ^ /ideal-body.html last; }
    location ~* ^/courses/anti-ofis/?$                          { rewrite ^ /antioffice.html last; }
    location ~* ^/courses/vebinary/?$                           { rewrite ^ /webinars.html last; }
    location ~* ^/courses/?$                                    { rewrite ^ /index.html last; }

    # ===================================
    # Маршруты услуг → .html файлы
    # ===================================
    location ~* ^/uslugi/onlayn-konsultatsiya/?$            { rewrite ^ /online-consultation.html last; }
    location ~* ^/uslugi/personalnye-trenirovki/?$          { rewrite ^ /personal-trainings.html last; }
    location ~* ^/uslugi/check-up/?$                        { rewrite ^ /check-up.html last; }
    location ~* ^/uslugi/soprovozhdenie-po-pitaniyu/?$      { rewrite ^ /nutrition-accompaniment.html last; }

    # ===================================
    # Остальные разделы → .html файлы
    # ===================================
    location ~* ^/cases/?$                  { rewrite ^ /cases.html last; }
    location ~* ^/blog/?$                   { rewrite ^ /blog.html last; }
    location ~* ^/about/?$                  { rewrite ^ /about.html last; }
    location ~* ^/contacts/?$               { rewrite ^ /contacts.html last; }
    location ~* ^/useful/?$                 { rewrite ^ /useful.html last; }
    location ~* ^/certificates/?$           { rewrite ^ /certificates.html last; }
    location ~* ^/payment/?$                { rewrite ^ /payment.html last; }
    location ~* ^/consent-personal-data/?$  { rewrite ^ /consent-personal-data.html last; }
    location ~* ^/privacy-policy/?$         { rewrite ^ /privacy-policy.html last; }
    location ~* ^/personal-data-policy/?$   { rewrite ^ /personal-data-policy.html last; }
    location ~* ^/terms-of-service/?$       { rewrite ^ /terms-of-service.html last; }

    # ===================================
    # Главная и всё остальное
    # ===================================
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ===================================
    # Страницы ошибок
    # ===================================
    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 /500.html;
}